<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34825f"/>
      <stop offset="100%" stop-color="#1e4d38"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fad074"/>
      <stop offset="100%" stop-color="#e8af4e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0e2419" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" fill="url(#bg-grad)"/>

  <!-- Book Graphic Group -->
  <g filter="url(#shadow)">
    <!-- Book Spine / Base -->
    <path d="M256 320 L136 305 L136 315 L256 330 L376 315 L376 305 Z" fill="#143224"/>
    
    <!-- Left Pages -->
    <path d="M256 320 L136 305 L121 180 L256 200 Z" fill="#f5faf6"/>
    <!-- Right Pages -->
    <path d="M256 320 L376 305 L391 180 L256 200 Z" fill="#ebf3ed"/>

    <!-- Page Text Lines -->
    <line x1="151" y1="200" x2="236" y2="214" stroke="#b4cdb9" stroke-width="4" stroke-linecap="round"/>
    <line x1="151" y1="225" x2="236" y2="239" stroke="#b4cdb9" stroke-width="4" stroke-linecap="round"/>
    <line x1="151" y1="250" x2="236" y2="264" stroke="#b4cdb9" stroke-width="4" stroke-linecap="round"/>
    <line x1="151" y1="275" x2="236" y2="289" stroke="#b4cdb9" stroke-width="4" stroke-linecap="round"/>

    <line x1="276" y1="214" x2="361" y2="200" stroke="#b4cdb9" stroke-width="4" stroke-linecap="round"/>
    <line x1="276" y1="239" x2="361" y2="225" stroke="#b4cdb9" stroke-width="4" stroke-linecap="round"/>
    <line x1="276" y1="264" x2="361" y2="250" stroke="#b4cdb9" stroke-width="4" stroke-linecap="round"/>
    <line x1="276" y1="289" x2="361" y2="275" stroke="#b4cdb9" stroke-width="4" stroke-linecap="round"/>

    <!-- Bookmark Ribbon -->
    <polygon points="244,190 268,190 268,345 256,332 244,345" fill="url(#gold-grad)"/>

    <!-- Graduation Cap Top -->
    <polygon points="256,105 356,150 256,195 156,150" fill="#ffffff"/>
    <!-- Cap Base -->
    <polygon points="206,175 306,175 294,205 218,205" fill="#e1ebe3"/>
    
    <!-- Cap Button & Tassel -->
    <circle cx="256" cy="150" r="6" fill="url(#gold-grad)"/>
    <path d="M256,150 Q331,170 334,215" fill="none" stroke="url(#gold-grad)" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="334" cy="221" rx="5" ry="8" fill="url(#gold-grad)"/>
  </g>
</svg>
